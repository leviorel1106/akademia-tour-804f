<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>הליכה חופשית בדירה · שכונת האקדמיה</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
  :root { --p:#175fa1; --glass:rgba(255,255,255,.92); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:#0e1a2b; font-family:"Heebo",system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; color:#1b1c1f; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .top { position:fixed; top:max(12px, env(safe-area-inset-top)); inset-inline:12px; display:flex; z-index:5; pointer-events:none; }
  .pill { pointer-events:auto; background:var(--glass); border-radius:16px; padding:9px 14px; box-shadow:0 6px 24px rgba(10,25,45,.22); font-size:.9rem; line-height:1.45; max-width:min(560px, 100%); }
  .pill b { color:var(--p); font-weight:800; }
  .pill button { border:0; background:var(--p); color:#fff; font:700 .82rem "Heebo",sans-serif; border-radius:999px; padding:6px 13px; cursor:pointer; margin:4px 0 0 6px; }
  .pill button.alt { background:#fff; color:var(--p); box-shadow:inset 0 0 0 2px var(--p); }
  #load { position:fixed; inset:0; z-index:6; display:grid; place-items:center; background:#0e1a2b; color:#fff; font-weight:700; transition:opacity .5s ease; }
  #load.off { opacity:0; pointer-events:none; }
  .joy { position:fixed; z-index:6; bottom:max(26px, env(safe-area-inset-bottom)); width:112px; height:112px; border-radius:50%; background:rgba(18,51,92,.28); border:2px solid rgba(255,255,255,.9); box-shadow:0 6px 24px rgba(10,25,45,.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); touch-action:none; cursor:grab; }
  .joy i { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:#fff; box-shadow:0 3px 12px rgba(0,0,0,.35); will-change:transform; }
  .joy small { position:absolute; left:0; right:0; top:-26px; text-align:center; color:#fff; font-size:.78rem; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  #jm { left:26px; } #jl { right:26px; }
</style>
</head>
<body>
<div id="load">טוען את הדירה…</div>
<div class="top">
  <div class="pill"><b>הליכה חופשית בדירה.</b> ג׳ויסטיק שמאלי או W A S D כדי ללכת, גרירה או ג׳ויסטיק ימני כדי להסתכל.<br>
    <button id="home">לנקודת ההתחלה</button><button id="mode" class="alt">להציג: <span id="mst">תמונה על המודל</span></button></div>
</div>
<div class="joy" id="jm"><small>הליכה</small><i></i></div>
<div class="joy" id="jl"><small>מבט</small><i></i></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
// The method: the 3D model from Blender carries the movement, the realistic 360 picture made from that same model carries the look.
// The picture is projected onto the model from the point it was taken from; where that point could not see a surface, the model's own colour shows.
const CFG = {"mesh": "flat.bin?b=21090355", "pano": "pano.jpg?b=21090355", "soft": "soft.jpg?b=21090355", "dist": "dist.png?b=21090355", "start": [0, 0, 0], "yaw": 0, "box": [-2.45, -4.1, 2.05, 3.1], "speed": 1.3};
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e1a2b);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
document.body.prepend(renderer.domElement);
const tl = new THREE.TextureLoader();
const load1 = (u) => new Promise((ok, no) => tl.load(u, ok, undefined, no));
const mat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: { tPano: { value: null }, tSoft: { value: null }, tDist: { value: null }, uMix: { value: 1 } },
  vertexShader: `attribute vec3 color; varying vec3 vP; varying vec3 vC; void main() { vP = position; vC = color; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vP; varying vec3 vC; uniform sampler2D tPano; uniform sampler2D tSoft; uniform sampler2D tDist; uniform float uMix;
    void main() {
      vec3 d = normalize(vP); float lon = atan(-d.x, d.z); float lat = asin(clamp(d.y, -1.0, 1.0));
      vec2 uv = vec2(0.5 + lon / 6.28318530718, 0.5 + lat / 3.14159265359);
      vec4 q = texture2D(tDist, uv); float seen = (q.r * 255.0 * 256.0 + q.g * 255.0) / 65535.0 * 20.0;       // how far the picture's camera sees in this direction
      float hidden = smoothstep(0.14, 0.34, length(vP) - seen * 1.03);
      vec3 pic = texture2D(tPano, uv).rgb;
      vec3 soft = texture2D(tSoft, uv).rgb * 0.93;      // a surface the picture never saw takes the blurred colour of what stands in front of it: almost always the same object
      gl_FragColor = vec4(mix(vC, mix(pic, soft, hidden), uMix), 1.0);
    }`,
});
(async () => {
  const [pano, soft, dist, buf] = await Promise.all([load1(CFG.pano), load1(CFG.soft), load1(CFG.dist), fetch(CFG.mesh).then((r) => r.arrayBuffer())]);
  soft.colorSpace = THREE.NoColorSpace; soft.wrapS = THREE.RepeatWrapping; soft.minFilter = THREE.LinearFilter; soft.generateMipmaps = false; mat.uniforms.tSoft.value = soft;
  pano.colorSpace = THREE.NoColorSpace; pano.wrapS = THREE.RepeatWrapping; pano.minFilter = THREE.LinearFilter; pano.generateMipmaps = false;
  dist.colorSpace = THREE.NoColorSpace; dist.wrapS = THREE.RepeatWrapping; dist.minFilter = dist.magFilter = THREE.NearestFilter; dist.generateMipmaps = false;
  mat.uniforms.tPano.value = pano; mat.uniforms.tDist.value = dist;
  const dv = new DataView(buf), nv = dv.getUint32(0, true), nt = dv.getUint32(4, true); let o = 8;
  const pos = new Float32Array(buf.slice(o, o + nv * 12)); o += nv * 12; const col = new Uint8Array(buf.slice(o, o + nv * 3)); o += nv * 3; o += (4 - o % 4) % 4; const idx = new Uint32Array(buf.slice(o, o + nt * 12));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3, true)); g.setIndex(new THREE.BufferAttribute(idx, 1));
  scene.add(new THREE.Mesh(g, mat)); document.querySelector('#load').classList.add('off'); window.__dbg.ready = true;
})().catch(() => { document.querySelector('#load').textContent = 'הקובץ לא נטען. נסו לרענן.'; });
camera.rotation.order = 'YXZ';
let yaw = CFG.yaw, pitch = 0; const pos = new THREE.Vector3(...CFG.start);
document.querySelector('#home').onclick = () => { pos.set(...CFG.start); yaw = CFG.yaw; pitch = 0; };
const MODES = [[1, 'תמונה על המודל'], [0, 'המודל בלבד']]; let mi = 0;
document.querySelector('#mode').onclick = () => { mi = (mi + 1) % MODES.length; mat.uniforms.uMix.value = MODES[mi][0]; document.querySelector('#mst').textContent = MODES[mi][1]; };
const cv = renderer.domElement; let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.004; pitch = Math.max(-1.3, Math.min(1.3, pitch - (e.clientY - drag[1]) * 0.004)); drag = [e.clientX, e.clientY]; });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, () => { drag = null; });
const sticks = { jm: { x: 0, y: 0 }, jl: { x: 0, y: 0 } };
for (const id of ['jm', 'jl']) {
  const el = document.getElementById(id), knob = el.lastElementChild; let pid = null;
  const mv = (e) => { const b = el.getBoundingClientRect(), R = 34; let dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2); const m = Math.hypot(dx, dy); if (m > R) { dx *= R / m; dy *= R / m; } sticks[id].x = dx / R; sticks[id].y = -dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`; };
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); pid = e.pointerId; try { el.setPointerCapture(pid); } catch (err) {} mv(e); });
  el.addEventListener('pointermove', (e) => { if (e.pointerId === pid) mv(e); });
  for (const ev of ['pointerup', 'pointercancel']) el.addEventListener(ev, (e) => { if (e.pointerId !== pid) return; pid = null; sticks[id].x = sticks[id].y = 0; knob.style.transform = ''; });
}
const keys = new Set();
addEventListener('keydown', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys.add(k); if (k.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
addEventListener('blur', () => keys.clear());
const has = (...k) => k.some((x) => keys.has(x)) ? 1 : 0;
function resize() { renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 90 : 72; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  yaw -= (sticks.jl.x + has('ArrowRight') - has('ArrowLeft')) * 1.4 * dt; pitch = Math.max(-1.3, Math.min(1.3, pitch + sticks.jl.y * 1.0 * dt));
  const f = sticks.jm.y + has('w', 'ArrowUp') - has('s', 'ArrowDown'), r = sticks.jm.x + has('d') - has('a');
  const sp = CFG.speed * (keys.has('Shift') ? 2.2 : 1);
  pos.x += (-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp * dt; pos.z += (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp * dt;
  pos.x = Math.max(CFG.box[0], Math.min(CFG.box[2], pos.x)); pos.z = Math.max(CFG.box[1], Math.min(CFG.box[3], pos.z));
  camera.position.copy(pos); camera.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera);
});
window.__dbg = { pos, camera, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, set pitch(v) { pitch = v; } };
</script>
</body>
</html>
