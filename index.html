<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>סיור בשכונת האקדמיה · לב העוטף שדרות</title>
<meta name="description" content="סיור 360 בשכונת האקדמיה בשדרות: מבט-על, הפארק, הכניסה לבניין, הלובי, הדירה, המרפסת ובית הספר.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
  :root { --p:#175fa1; --p2:#1aa3e0; --deep:#12335c; --ink:#1b1c1f; --muted:#55595f; --cream:#faf8f3; --line:#e4e1da; --heart:#e8274b; --glass:rgba(255,255,255,.92); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:#0e1a2b; color:var(--ink); font-family:"Heebo",system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  button { font-family:inherit; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none; }
  canvas.drag { cursor:grabbing; }
  #veil { position:fixed; inset:0; background:#0e1a2b; opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:2; }
  #veil.on { opacity:1; }

  /* top bar */
  .top { position:fixed; top:max(12px, env(safe-area-inset-top)); inset-inline:12px; display:flex; align-items:center; gap:10px; z-index:5; pointer-events:none; }
  .brand { pointer-events:auto; display:flex; align-items:center; gap:12px; background:var(--glass); border-radius:16px; padding:8px 14px; box-shadow:0 6px 24px rgba(10,25,45,.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); min-width:0; }
  .brand img { height:34px; width:auto; display:block; }
  .brand .where { min-width:0; border-inline-start:1px solid var(--line); padding-inline-start:12px; }
  .brand .where small { display:block; color:var(--muted); font-size:.72rem; font-weight:500; line-height:1.2; }
  .brand .where b { display:block; font-size:1rem; font-weight:800; color:var(--deep); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* station strip */
  .strip { position:fixed; bottom:max(12px, env(safe-area-inset-bottom)); inset-inline:12px; z-index:5; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .cap { pointer-events:auto; align-self:flex-start; max-width:min(560px,100%); background:var(--glass); border-radius:14px; padding:9px 14px; font-size:.92rem; line-height:1.5; color:var(--ink); box-shadow:0 6px 24px rgba(10,25,45,.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .cap b { color:var(--p); font-weight:800; }
  .row { display:flex; align-items:flex-end; gap:8px; }
  .thumbs { pointer-events:auto; flex:1; min-width:0; display:flex; gap:8px; overflow-x:auto; padding:6px; background:var(--glass); border-radius:18px; box-shadow:0 6px 24px rgba(10,25,45,.22); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); scrollbar-width:none; }
  .thumbs::-webkit-scrollbar { display:none; }
  .thumbs button { flex:0 0 auto; width:112px; border:0; padding:0; background:none; cursor:pointer; text-align:center; color:var(--ink); }
  .thumbs img { width:112px; height:60px; object-fit:cover; border-radius:12px; display:block; outline:3px solid transparent; outline-offset:-3px; transition:outline-color .2s; }
  .thumbs span { display:block; margin-top:4px; font-size:.74rem; font-weight:500; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thumbs button.on img { outline-color:var(--p2); }
  .thumbs button.on span { font-weight:800; color:var(--p); }
  .tools { pointer-events:auto; display:flex; flex-direction:column; gap:6px; }
  .tools button { width:44px; height:44px; border:0; border-radius:14px; background:var(--glass); color:var(--deep); font-size:1.25rem; font-weight:800; cursor:pointer; box-shadow:0 6px 24px rgba(10,25,45,.22); display:grid; place-items:center; }
  .tools button.on { background:var(--p); color:#fff; }
  .tools svg { width:22px; height:22px; }

  /* hotspots */
  .hot { position:fixed; z-index:3; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:6px; border:0; background:none; cursor:pointer; padding:0; color:#fff; }
  .hot i { width:52px; height:52px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 4px 18px rgba(0,0,0,.4); position:relative; }
  .hot i::after { content:""; position:absolute; inset:-7px; border-radius:50%; border:2px solid rgba(255,255,255,.85); animation:pulse 2s ease-out infinite; }
  .hot i svg { width:24px; height:24px; color:var(--p); }
  .hot span { background:rgba(18,51,92,.9); color:#fff; font-size:.84rem; font-weight:700; padding:5px 12px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  .hot:hover i, .hot:focus-visible i { background:var(--p); } .hot:hover i svg, .hot:focus-visible i svg { color:#fff; }
  @keyframes pulse { 0% { transform:scale(.85); opacity:.9; } 100% { transform:scale(1.35); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .hot i::after { animation:none; opacity:.6; } #veil { transition:none; } }

  /* intro */
  #intro { position:fixed; inset:0; z-index:10; display:grid; padding:20px; overflow-y:auto; background:linear-gradient(180deg, rgba(14,26,43,.55), rgba(14,26,43,.8)), url("t/park.jpg") center/cover; }
  .card { margin:auto; width:min(560px,100%); background:#fff; border-radius:26px; padding:30px 26px 24px; text-align:center; box-shadow:0 30px 80px rgba(0,0,0,.45); }
  .logos { display:flex; justify-content:center; align-items:center; gap:22px; flex-wrap:wrap; margin-bottom:20px; }
  .logos img { height:54px; width:auto; }
  .card h1 { margin:0 0 10px; font-size:clamp(1.7rem,6vw,2.4rem); font-weight:900; line-height:1.12; color:var(--deep); text-wrap:balance; }
  .card h1 em { font-style:normal; color:var(--p2); }
  .card p { margin:0 auto 20px; max-width:42ch; color:var(--muted); font-size:1.02rem; line-height:1.6; }
  .go { border:0; background:var(--p); color:#fff; font-size:1.1rem; font-weight:800; padding:14px 34px; border-radius:999px; cursor:pointer; box-shadow:0 10px 26px rgba(23,95,161,.4); }
  .go:hover { background:var(--deep); }
  .how { display:flex; justify-content:center; gap:6px 18px; flex-wrap:wrap; margin:20px 0 0; padding:16px 0 0; border-top:1px solid var(--line); color:var(--muted); font-size:.86rem; }
  .how b { color:var(--ink); font-weight:700; }
  .card p.fine { margin:14px 0 0; color:#8a8e94; font-size:.74rem; max-width:none; }
  #load { position:fixed; inset:0; z-index:4; display:grid; place-items:center; pointer-events:none; color:#fff; font-weight:700; opacity:0; transition:opacity .2s; }
  #load.on { opacity:1; }
  #load span { background:rgba(18,51,92,.85); padding:8px 16px; border-radius:999px; }
  @media (max-width:560px) { .brand img { height:28px; } .thumbs button, .thumbs img { width:92px; } .thumbs img { height:50px; } .cap { font-size:.86rem; } .logos img { height:44px; } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="תמונת 360 של התחנה. גררו כדי להסתכל מסביב"></canvas>
<div id="veil"></div>
<div id="load"><span>טוען את התחנה…</span></div>

<div class="top">
  <div class="brand">
    <img src="a/akademia.png" alt="שכונת האקדמיה">
    <div class="where"><small id="count"></small><b id="name"></b></div>
  </div>
</div>

<div id="hots"></div>

<div class="strip">
  <div class="cap" id="cap"></div>
  <div class="row">
    <div class="thumbs" id="thumbs" role="tablist" aria-label="תחנות הסיור"></div>
    <div class="tools">
      <button id="gyro" hidden aria-label="שליטה בהזזת הטלפון" title="שליטה בהזזת הטלפון"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/><path d="M2.5 9c-1 2-1 4 0 6M21.5 9c1 2 1 4 0 6"/></svg></button>
      <button id="zin" aria-label="להתקרב">+</button>
      <button id="zout" aria-label="להתרחק">−</button>
    </div>
  </div>
</div>

<div id="intro">
  <div class="card">
    <div class="logos"><img src="a/lev.png" alt="לב העוטף שדרות"><img src="a/akademia.png" alt="שכונת האקדמיה"></div>
    <h1>סיור בשכונת <em>האקדמיה</em></h1>
    <p>שבע תחנות ב-360 מעלות: מהמבט-על, דרך הפארק והכניסה לבניין, ועד הסלון, המרפסת ובית הספר.</p>
    <button class="go" id="go">מתחילים בסיור</button>
    <div class="how"><span><b>גוררים</b> כדי להסתכל מסביב</span><span><b>לוחצים על החצים</b> כדי להתקדם</span><span><b>+ ו־−</b> כדי להתקרב</span></div>
    <p class="fine">ההדמיות להמחשה בלבד.</p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
// hots: [target station, yaw (radians right of the picture centre), pitch, label]
const STATIONS = [{"id": "sky", "name": "מבט-על על השכונה", "short": "מבט-על", "cap": "<b>מבט-על.</b> השכונה כולה: הבניינים, הפארק, השדרה הראשית והשדות מסביב.", "start": -0.16, "src": "p/sky.jpg", "thumb": "t/sky.jpg", "hots": [["park", -0.16, -0.22, "יורדים לפארק"], ["entrance", 0.62, -0.33, "לכניסה לבניין"], ["school", -1.85, -0.2, "לבית הספר"]]}, {"id": "park", "name": "הפארק וגן השעשועים", "short": "הפארק", "cap": "<b>הפארק השכונתי.</b> גן שעשועים, דשא ושבילים בלב הבניינים.", "start": 0, "src": "p/park.jpg", "thumb": "t/park.jpg", "hots": [["entrance", 1.316, -0.023, "לכניסה לבניין"], ["school", -0.458, -0.046, "לבית הספר"], ["sky", -2.54, 0.75, "עולים למבט-על"]]}, {"id": "entrance", "name": "הכניסה לבניין", "short": "הכניסה לבניין", "cap": "<b>הכניסה לבניין.</b> שביל מרוצף מהפארק עד הדלת.", "start": 0, "src": "p/entrance.jpg", "thumb": "t/entrance.jpg", "hots": [["lobby", -0.0, -0.062, "נכנסים ללובי"], ["park", -1.477, 0.023, "לפארק"], ["sky", -1.75, 0.9, "מבט-על"]]}, {"id": "lobby", "name": "הלובי", "short": "הלובי", "cap": "<b>הלובי.</b> מעליות, תיבות דואר ואור יום מהכניסה.", "start": 0, "src": "p/lobby.jpg", "thumb": "t/lobby.jpg", "hots": [["apartment", -0.133, -0.044, "עולים לדירה"], ["entrance", -3.142, -0.091, "יוצאים החוצה"]]}, {"id": "apartment", "name": "הדירה", "short": "הדירה", "cap": "<b>הדירה.</b> סלון ומטבח פתוח, עם יציאה למרפסת.", "start": 0, "src": "p/apartment.jpg", "thumb": "t/apartment.jpg", "hots": [["balcony", 0.146, -0.087, "יוצאים למרפסת"], ["lobby", 2.425, -0.073, "יורדים ללובי"]]}, {"id": "balcony", "name": "המרפסת", "short": "המרפסת", "cap": "<b>המרפסת.</b> קומה רביעית, מעל הפארק.", "start": 0, "src": "p/balcony.jpg", "thumb": "t/balcony.jpg", "hots": [["apartment", 2.82, -0.306, "חוזרים לסלון"], ["park", -0.106, -0.353, "יורדים לפארק"], ["sky", -0.455, 0.8, "מבט-על"]]}, {"id": "school", "name": "בית הספר", "short": "בית הספר", "cap": "<b>בית הספר.</b> בוקר בחצר, קרוב לבית.", "start": 0, "src": "p/school.jpg", "thumb": "t/school.jpg", "hots": [["park", -2.029, 0.046, "חוזרים לפארק"], ["sky", -1.907, 0.75, "מבט-על"]]}];
const $ = (s) => document.querySelector(s);
const canvas = $('#gl'), hotsEl = $('#hots'), thumbs = $('#thumbs'), veil = $('#veil'), load = $('#load');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(78, 1, 0.1, 100);
camera.rotation.order = 'YXZ';
const geo = new THREE.SphereGeometry(50, 96, 48); geo.scale(-1, 1, 1);
const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
scene.add(new THREE.Mesh(geo, mat));
const loader = new THREE.TextureLoader(), cache = {};
const maxAniso = renderer.capabilities.getMaxAnisotropy();
let cur = null, yaw = Math.PI / 2, pitch = 0, hotNodes = [], touched = false, started = false;
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>';
function dirOf(y, p) { const a = Math.PI / 2 - y; return new THREE.Vector3(-Math.sin(a) * Math.cos(p), Math.sin(p), -Math.cos(a) * Math.cos(p)); }
function tex(st) {
  if (cache[st.id]) return Promise.resolve(cache[st.id]);
  return new Promise((ok, no) => loader.load(st.src, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; t.generateMipmaps = true; cache[st.id] = t; ok(t); }, undefined, no));
}
async function show(st, instant) {
  if (cur === st) return;
  const first = !cur; cur = st;
  thumbs.querySelectorAll('button').forEach((b) => { const on = b.dataset.id === st.id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: first ? 'auto' : 'smooth' }); });
  $('#name').textContent = st.name; $('#count').textContent = 'תחנה ' + (STATIONS.indexOf(st) + 1) + ' מתוך ' + STATIONS.length; $('#cap').innerHTML = st.cap;
  hotsEl.innerHTML = ''; hotNodes = [];
  if (!instant) veil.classList.add('on');
  const timer = setTimeout(() => load.classList.add('on'), 350);
  let t; try { [t] = await Promise.all([tex(st), new Promise((r) => setTimeout(r, instant ? 0 : 260))]); } catch (e) { clearTimeout(timer); load.classList.add('on'); load.firstElementChild.textContent = 'התמונה לא נטענה. נסו לרענן את הדף.'; return; }
  clearTimeout(timer); load.classList.remove('on');
  if (cur !== st) return;
  mat.map = t; mat.needsUpdate = true;
  yaw = Math.PI / 2 - (st.start || 0); pitch = 0; gyroOffset = null; camera.fov = 78; camera.updateProjectionMatrix();
  for (const [to, hy, hp, label] of st.hots) {
    const b = document.createElement('button'); b.className = 'hot'; b.innerHTML = '<i>' + ARROW + '</i><span></span>'; b.lastChild.textContent = label; b.setAttribute('aria-label', label);
    b.onclick = () => show(STATIONS.find((s) => s.id === to)); hotsEl.appendChild(b); hotNodes.push([b, dirOf(hy, hp)]);
  }
  veil.classList.remove('on');
  for (const [to] of st.hots) tex(STATIONS.find((s) => s.id === to)).catch(() => {});
}
STATIONS.forEach((st) => {
  const b = document.createElement('button'); b.dataset.id = st.id; b.setAttribute('role', 'tab');
  b.innerHTML = '<img alt="" loading="lazy"><span></span>'; b.firstChild.src = st.thumb; b.lastChild.textContent = st.short; b.onclick = () => show(st); thumbs.appendChild(b);
});
function zoom(k) { camera.fov = Math.max(26, Math.min(96, camera.fov * k)); camera.updateProjectionMatrix(); }

// ---- phone motion (optional)
const gyroBtn = $('#gyro'); let gyroOn = false, dev = null, gyroOffset = null;
const zee = new THREE.Vector3(0, 0, 1), eul = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2), devQ = new THREE.Quaternion(), yawQ = new THREE.Quaternion(), fwd = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
function onDev(e) { if (e.alpha == null) return; dev = e; }
if ('DeviceOrientationEvent' in window && matchMedia('(pointer: coarse)').matches) gyroBtn.hidden = false;
gyroBtn.onclick = async () => {
  if (gyroOn) { gyroOn = false; removeEventListener('deviceorientation', onDev); gyroBtn.classList.remove('on'); return; }
  try { if (typeof DeviceOrientationEvent.requestPermission === 'function' && (await DeviceOrientationEvent.requestPermission()) !== 'granted') return; } catch (e) { return; }
  dev = null; gyroOffset = null; gyroOn = true; addEventListener('deviceorientation', onDev); gyroBtn.classList.add('on'); touched = true;
};

// ---- look around
const pts = new Map(); let pinch = 0;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); canvas.classList.add('drag'); touched = true; });
canvas.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    const k = 0.0045 * camera.fov / 78, dx = (e.clientX - prev[0]) * k;
    if (gyroOn && gyroOffset != null) gyroOffset += dx; else { yaw += dx; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - prev[1]) * k)); }
  } else if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoom(pinch / d); pinch = d; }
});
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, (e) => { pts.delete(e.pointerId); pinch = 0; if (!pts.size) canvas.classList.remove('drag'); });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); touched = true; zoom(e.deltaY > 0 ? 1.07 : 0.93); }, { passive: false });
canvas.addEventListener('keydown', (e) => {
  const s = 0.09; touched = true;
  if (e.key === 'ArrowLeft') yaw += s; else if (e.key === 'ArrowRight') yaw -= s; else if (e.key === 'ArrowUp') pitch = Math.min(1.4, pitch + s); else if (e.key === 'ArrowDown') pitch = Math.max(-1.4, pitch - s);
  else if (e.key === '+' || e.key === '=') zoom(0.9); else if (e.key === '-') zoom(1.1); else return;
  e.preventDefault();
});
$('#zin').onclick = () => zoom(0.8); $('#zout').onclick = () => zoom(1.25);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const v = new THREE.Vector3(); let last = performance.now();
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(now) {
  const dt = Math.min(0.05, ((now || last) - last) / 1000); last = now || last;
  if (started && !touched && !calm) yaw -= dt * 0.035;                      // slow drift until the visitor takes over
  if (gyroOn && dev) {
    eul.set(THREE.MathUtils.degToRad(dev.beta || 0), THREE.MathUtils.degToRad(dev.alpha || 0), -THREE.MathUtils.degToRad(dev.gamma || 0), 'YXZ');
    devQ.setFromEuler(eul).multiply(q1).multiply(q0.setFromAxisAngle(zee, -THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || 0)));
    if (gyroOffset == null) { fwd.set(0, 0, -1).applyQuaternion(devQ); gyroOffset = yaw - Math.atan2(-fwd.x, -fwd.z); }
    camera.quaternion.copy(yawQ.setFromAxisAngle(up, gyroOffset)).multiply(devQ);
  } else camera.rotation.set(pitch, yaw, 0);
  camera.updateMatrixWorld(); renderer.render(scene, camera);
  for (const [node, d] of hotNodes) {
    v.copy(d).multiplyScalar(40).project(camera);
    const front = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    node.style.display = front ? '' : 'none';
    if (front) { node.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; node.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px'; }
  }
  requestAnimationFrame(loop);
})();
const want = STATIONS.find((s) => s.id === location.hash.slice(1));
show(want || STATIONS[0], true);
$('#go').onclick = () => { $('#intro').remove(); started = true; canvas.focus(); };
if (want) { $('#intro').remove(); started = true; }
</script>
</body>
</html>
